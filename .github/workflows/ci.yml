name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: macos-latest
    # Force every cargo/rustfmt/clippy call onto the pinned toolchain. The runner
    # otherwise resolves a newer ambient rustfmt than the one installed below,
    # which reformats unchanged code and breaks `cargo fmt --check`. Single source
    # of truth for the version — the Setup Rust step reads it too.
    env:
      RUSTUP_TOOLCHAIN: "1.97.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        # Dependabot bumps package.json but not bun.lock, so a frozen install
        # fails on its PRs. Regenerate for those (the dependabot-lockfile workflow
        # commits the refreshed bun.lock back); stay frozen everywhere else.
        run: bun install ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: Run frontend tests with coverage
        run: bun run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore

      - name: Build app
        # A debug `tauri build` (its beforeBuildCommand is `bun run build`) runs
        # Tauri's npm-vs-crate version check, so a Dependabot bump that moves
        # only the Rust crates fails here instead of in the release workflow.
        run: bun run tauri build --debug --no-bundle

      - name: Check Rust formatting
        working-directory: src-tauri
        run: |
          cargo fmt --version
          cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
